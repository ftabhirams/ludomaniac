<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap In Ludo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
        body { background: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
        
        .header-box { text-align: center; margin-bottom: 12px; }
        h1 { color: #00A878; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .status-card { background: #1e1e1e; padding: 10px 16px; border-radius: 10px; border: 1px solid #2c2c2c; width: 100%; max-width: 340px; text-align: center; margin-bottom: 14px; }
        .mode-badge { background: rgba(0, 168, 120, 0.15); color: #00A878; font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 12px; display: inline-block; margin-bottom: 4px; }
        .turn-text { font-size: 0.85rem; color: #a0a0a0; margin-top: 4px; }

        /* LUDO BOARD CANVAS LAYOUT */
        .board-wrapper { width: 320px; height: 320px; background: #1a1a1a; border-radius: 14px; position: relative; border: 3px solid #00A878; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
        .house { border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; color: #121212; position: relative; }
        .house.red { background: #ff4d4d; }
        .house.green { background: #00e676; }
        .house.yellow { background: #ffca28; }
        .house.blue { background: #29b6f6; }
        
        .player-badge { font-size: 0.75rem; background: rgba(18, 18, 18, 0.85); color: #fff; padding: 3px 8px; border-radius: 6px; margin-top: 6px; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

        /* CONTROLS AREA */
        .controls { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .dice-box { width: 64px; height: 64px; background: #1e1e1e; border: 2px solid #00A878; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: bold; color: #00A878; box-shadow: 0 4px 12px rgba(0,168,120,0.2); }
        .btn-roll { background: #00A878; color: #121212; font-weight: 700; border: none; padding: 12px 28px; border-radius: 25px; font-size: 0.95rem; cursor: pointer; transition: transform 0.1s; }
        .btn-roll:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>🎲 Tap In Ludo</h1>
    </div>

    <div class="status-card">
        <div class="mode-badge">⚡ Private Match</div>
        <div id="turn-display" class="turn-text">Connecting to match...</div>
    </div>

    <!-- 2D Ludo Board -->
    <div class="board-wrapper">
        <div class="house red">
            RED
            <div id="player-red" class="player-badge">Waiting...</div>
        </div>
        <div class="house green">
            GREEN
            <div id="player-green" class="player-badge">Waiting...</div>
        </div>
        <div class="house yellow">
            YELLOW
            <div id="player-yellow" class="player-badge">Waiting...</div>
        </div>
        <div class="house blue">
            BLUE
            <div id="player-blue" class="player-badge">Waiting...</div>
        </div>
    </div>

    <!-- Dice Roll Area -->
    <div class="controls">
        <div id="dice-result" class="dice-box">🎲</div>
        <button id="btn-roll" class="btn-roll">Roll Dice</button>
    </div>

    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // 1. AUTO-DETECT NAME & ROOM FROM CHAT APP URL (NO PROMPTS / NO CODES SHOWN)
        const urlParams = new URLSearchParams(window.location.search);
        const myName = urlParams.get('name') || 'Player';
        const myRoom = urlParams.get('room') || 'default_room';

        // Auto Join Game Session on Page Load
        socket.emit('joinGame', { room: myRoom, name: myName });

        // Update Board & Active Players
        socket.on('updatePlayers', ({ players, currentTurnColor }) => {
            ['red', 'green', 'yellow', 'blue'].forEach(c => {
                document.getElementById(`player-${c}`).innerText = 'Waiting...';
            });

            players.forEach(p => {
                const el = document.getElementById(`player-${p.color.toLowerCase()}`);
                if (el) el.innerText = p.name;
            });

            document.getElementById('turn-display').innerText = `Current Turn: ${currentTurnColor}`;
        });

        // Trigger Dice Roll
        document.getElementById('btn-roll').onclick = () => {
            socket.emit('rollDice', { room: myRoom });
        };

        // Handle Broadcasted Dice Result
        socket.on('diceRolled', ({ rollerName, diceValue, nextTurnColor }) => {
            document.getElementById('dice-result').innerText = diceValue;
            document.getElementById('turn-display').innerText = `${rollerName} rolled a ${diceValue}! Next Turn: ${nextTurnColor}`;
        });

        socket.on('errorMsg', (msg) => alert(msg));
    </script>
</body>
</html>
